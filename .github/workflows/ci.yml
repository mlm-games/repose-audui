name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# baseview's opengl backend pulls the x11 crate (gl + xlib + xlib-xcb) and
# repose pulls fontconfig; the rest cover winit and clipawl.
env:
  LINUX_DEPS: libasound2-dev libgl-dev libegl-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev libxext-dev libxinerama-dev libxi-dev libxrandr-dev libxss-dev libxkbcommon-dev libwayland-dev libfontconfig-dev pkg-config

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_DEPS }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Run workspace tests
        run: cargo test --workspace --locked

  baseview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_DEPS }}
      - name: Check the baseview window host
        run: cargo check --workspace --all-targets --locked --features baseview
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked --features baseview

  nih-plug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_DEPS }}
      - name: Check the nih-plug editor
        run: cargo check --workspace --all-targets --locked --features nih-plug
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked --features nih-plug
